[project]
name = "from-3d-to-campaign"
description = "Turn a 3D model of a building into social-ready campaign assets: geometry-faithful renders, an automatic quality gate, validated copy and a laid-out post — all in one ComfyUI graph."
version = "0.1.0"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["numpy>=2", "pillow>=11", "websocket-client>=1.8"]
classifiers = [
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Environment :: GPU :: NVIDIA CUDA",
]

[project.urls]
Repository = "https://github.com/meryboth/from-3d-to-campaign"

[tool.comfy]
# PublisherId is the handle after the "@" on your registry profile. It is permanent,
# and `comfy node publish` fails if it does not match the account holding the API key.
PublisherId = "meryboth"
DisplayName = "From 3D to Campaign"
Icon = ""
requires-comfyui = ">=0.3.40"

# The realism metrics (open_clip_torch, pyiqa) are deliberately NOT dependencies: both
# pull their own torch build and would replace the CUDA one ComfyUI runs on. The gate
# detects them at call time and reports "realism skipped" when they are absent.
